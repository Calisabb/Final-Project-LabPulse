<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070d14">
  <meta name="description" content="LabPulse - Homelab Service Monitoring & Health Operations Panel">
  <title>LabPulse · Homelab Operations</title>

  <!-- Local Vendored Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css?v=8">
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=8">

  <!-- Local Vendored Application Scripts -->
  <script src="vendor/alpine.min.js" defer></script>
  <script src="js/format.js?v=8"></script>
  <script src="js/auth.js?v=8"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</head>
<body x-data="app" class="app-reveal" x-cloak>

  <!-- Authentic CRT Scanlines Texture Overlay -->
  <div class="edex-scanlines" aria-hidden="true"></div>

  <!-- SVG Icon Sprite (inline, display:none) -->
  <svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg">
    <!-- Service type icons -->
    <symbol id="icon-server" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1" fill="currentColor"/><circle cx="6" cy="18" r="1" fill="currentColor"/></symbol>
    <symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></symbol>
    <symbol id="icon-container" viewBox="0 0 24 24"><path d="M20.9 7.5L12 2 3.1 7.5v9L12 22l8.9-5.5V7.5z"/><path d="M12 2v20M3.1 7.5l8.9 5.5 8.9-5.5"/></symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
    <symbol id="icon-router" viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="10" rx="2"/><path d="M6 9V5m4 4V5m4 4V5m4 4V5"/><circle cx="6" cy="14" r="1" fill="currentColor"/><circle cx="10" cy="14" r="1" fill="currentColor"/></symbol>
    <symbol id="icon-film" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></symbol>
    <symbol id="icon-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <!-- UI action icons -->
    <symbol id="icon-bolt" viewBox="0 0 24 24"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
    <symbol id="icon-broadcast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M7.76 7.76a6 6 0 0 0 0 8.49"/><path d="M20.07 4.93a10 10 0 0 1 0 14.14"/><path d="M3.93 4.93a10 10 0 0 0 0 14.14"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
    <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></symbol>
  </svg>

  <!-- Toast Notification Stack -->
  <div class="toast-container" aria-live="polite" aria-atomic="true">
    <template x-for="toast in $store.toasts.items" :key="toast.id">
      <div class="toast" :class="'toast-' + toast.type" role="alert">
        <span x-text="toast.message"></span>
        <button type="button" class="btn-icon btn-sm" aria-label="Dismiss notification" @click="$store.toasts.remove(toast.id)">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </div>
    </template>
  </div>

  <!-- Unauthenticated: Terminal Login Screen -->
  <template x-if="!isAuthenticated">
    <main class="modal-backdrop" style="position: fixed; inset: 0; background: var(--term-bg); z-index: var(--z-sticky);">
      <div class="modal-dialog" style="max-width: 420px; margin: auto; border: 1px solid var(--term-border-bright);">
        <div class="modal-header" style="background: var(--term-header); border-bottom: 1px solid var(--term-border);">
          <div style="display: flex; align-items: center; gap: var(--space-2);">
            <span class="status-dot-pulse"></span>
            <span class="brand-title" style="font-size: 0.95rem;">SECURE_ACCESS // LOGIN</span>
          </div>
          <span style="font-size: 0.7rem; color: var(--term-cyan); font-family: var(--font-mono);">[PORT: 5046]</span>
        </div>

        <form @submit.prevent="handleLogin" class="modal-body" style="background: var(--term-surface);">
          <div style="margin-bottom: var(--space-3); border-bottom: 1px solid var(--term-border-subtle); padding-bottom: var(--space-2);">
            <div style="font-size: 0.75rem; color: var(--term-cyan); font-family: var(--font-mono); letter-spacing: 0.04em;">
              IDENTITY_AUTHENTICATION_GATEWAY
            </div>
            <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;">
              Enter operator credentials to establish encrypted session.
            </p>
          </div>

          <!-- Session Expiry or Notice Alert -->
          <div x-show="loginMessage" x-transition class="form-error" style="background: rgba(0, 242, 255, 0.08); border: 1px solid var(--term-cyan); color: var(--term-cyan); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-3);" role="status">
            <span x-text="loginMessage"></span>
          </div>

          <!-- Login Error Alert -->
          <div x-show="loginError" x-transition class="form-error" style="background: var(--term-red-dim); border: 1px solid var(--term-red); color: var(--term-red); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-3);" role="alert">
            <span x-text="loginError"></span>
          </div>

          <div class="form-group">
            <label for="login-username" class="form-label">&gt; IDENTITY / USERNAME</label>
            <input
              id="login-username"
              type="text"
              class="form-input"
              x-model="loginForm.userName"
              placeholder="e.g. admin"
              autocomplete="username"
              required
              autofocus
            >
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label"># KEY / PASSWORD</label>
            <input
              id="login-password"
              type="password"
              class="form-input"
              x-model="loginForm.password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="btn-terminal btn-terminal-primary" style="width: 100%; margin-top: var(--space-3); padding: 0.65rem;" :disabled="loginLoading">
            <span x-show="loginLoading" class="spinner-terminal" aria-hidden="true"></span>
            <span x-text="loginLoading ? 'AUTHENTICATING...' : 'AUTHENTICATE &gt;&gt;'"></span>
          </button>
        </form>
      </div>
    </main>
  </template>

  <!-- Authenticated Application Shell -->
  <template x-if="isAuthenticated">
    <div class="edex-shell">
      <!-- Top Master Bezel Bar -->
      <header class="edex-topbar">
        <div class="edex-brand">
          <span class="edex-pulse-led"></span>
          <span style="font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em;">LabPulse</span>
        </div>

        <!-- Terminal View Tabs -->
        <nav class="edex-topbar-tabs" aria-label="Terminal Views">
          <button
            type="button"
            class="edex-tab-btn"
            :class="{ 'active': currentView === 'services' }"
            @click="currentView = 'services'"
          >
            <svg class="icon"><use href="#icon-server"></use></svg>
            <span>[01 // MONITORED_NODES]</span>
          </button>
          <button
            type="button"
            class="edex-tab-btn"
            :class="{ 'active': currentView === 'incidents' }"
            @click="currentView = 'incidents'"
          >
            <svg class="icon"><use href="#icon-broadcast"></use></svg>
            <span>[02 // ACTIVE_INCIDENTS]</span>
            <span
              x-show="incidents.filter(i => !i.resolvedAt).length > 0"
              class="tab-badge"
              x-text="incidents.filter(i => !i.resolvedAt).length"
            ></span>
          </button>
        </nav>

        <!-- Right System Meta & Logout -->
        <div class="edex-topbar-meta">
          <span>OPERATOR: <strong x-text="userName"></strong></span>
          <span>SESSION: <strong x-text="sessionUptimeFormatted"></strong></span>
          <button
            type="button"
            class="btn-icon btn-sm"
            @click="handleLogout"
            title="Terminate operator session"
            aria-label="Logout"
          >
            <svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg>
          </button>
        </div>
      </header>

      <!-- 4-Zone eDEX Grid -->
      <main class="edex-grid">
        <!-- ================= ZONE 1: LEFT PANEL (TELEMETRY & CLUSTERS) ================= -->
        <aside class="edex-panel edex-left-col" aria-label="System Telemetry">
          <div class="edex-panel-header">
            <span>[01 // TELEMETRY]</span>
            <span style="color: var(--edex-text-muted); font-size: 0.62rem;">PORT: 5046</span>
          </div>

          <div class="edex-panel-body">
            <!-- Digital Clock Widget -->
            <div class="edex-clock-card">
              <div class="edex-clock-digits" x-text="currentTimeStr">20:28:46</div>
              <div class="edex-clock-sub">
                <span x-text="currentDateStr">24 NOV 2026</span>
                <span>SWEEP: <strong style="color: var(--edex-cyan);" x-text="sweepCountdownSec + 's'"></strong></span>
              </div>
            </div>

            <!-- Health Gauge Card -->
            <div class="edex-health-card">
              <div class="edex-health-header">
                <span class="edex-health-pct" :style="{ color: offlineServicesCount === 0 ? 'var(--edex-green)' : 'var(--edex-red)' }" x-text="healthPercent + '%'"></span>
                <span class="edex-health-status" :style="{ color: offlineServicesCount === 0 ? 'var(--edex-green)' : 'var(--edex-red)' }" x-text="offlineServicesCount === 0 ? 'ALL SYSTEMS OPERATIONAL' : 'SYSTEM DEGRADED'"></span>
              </div>
              <div class="edex-meter-track">
                <div class="edex-meter-fill" :style="{ width: healthPercent + '%', background: offlineServicesCount === 0 ? 'var(--edex-green)' : 'var(--edex-red)' }"></div>
              </div>

              <!-- Quick Metrics Grid -->
              <div class="edex-stats-row">
                <div class="edex-stat-box">
                  <span class="edex-stat-label">Online Nodes</span>
                  <span class="edex-stat-val" style="color: var(--edex-green);" x-text="onlineServicesCount + '/' + services.length"></span>
                </div>
                <div class="edex-stat-box">
                  <span class="edex-stat-label">Avg Latency</span>
                  <span class="edex-stat-val" style="color: var(--edex-cyan);" x-text="averageLatencyMs ? averageLatencyMs + 'ms' : '--'"></span>
                </div>
                <div class="edex-stat-box">
                  <span class="edex-stat-label">Incidents</span>
                  <span class="edex-stat-val" :style="{ color: offlineServicesCount > 0 ? 'var(--edex-red)' : 'var(--edex-text-muted)' }" x-text="offlineServicesCount"></span>
                </div>
                <div class="edex-stat-box">
                  <span class="edex-stat-label">Clusters</span>
                  <span class="edex-stat-val" style="color: var(--edex-cyan);" x-text="categories.length"></span>
                </div>
              </div>
            </div>

            <!-- Category Cluster Filters -->
            <div style="margin-top: 6px;">
              <div class="edex-dock-label" style="margin-bottom: 6px; font-size: 0.65rem;">// CLUSTERS</div>
              <div class="edex-cluster-list">
                <button
                  type="button"
                  class="edex-cluster-btn"
                  :class="{ 'active': selectedCategory === null }"
                  @click="selectedCategory = null"
                >
                  <span>[ALL NODES]</span>
                  <span class="edex-cluster-badge" x-text="services.length"></span>
                </button>

                <template x-for="cat in categories" :key="cat.id">
                  <button
                    type="button"
                    class="edex-cluster-btn"
                    :class="{ 'active': selectedCategory === cat.id }"
                    @click="selectedCategory = (selectedCategory === cat.id ? null : cat.id)"
                  >
                    <span style="display: flex; align-items: center; min-width: 0;">
                      <span class="edex-cluster-dot" :style="{ background: cat.color || 'var(--edex-cyan)' }"></span>
                      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" x-text="cat.name"></span>
                    </span>
                    <span class="edex-cluster-badge" x-text="services.filter(s => s.categoryId === cat.id).length"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </aside>

        <!-- ================= ZONE 2: CENTER PANEL (MAIN SHELL & BLADE CARDS) ================= -->
        <section class="edex-panel edex-center-col" aria-label="Operations Grid">
          <div class="edex-panel-header">
            <span x-text="currentView === 'services' ? '[02 // OPERATIONS_CORE]' : '[02 // INCIDENT_STREAM]'"></span>
            <span style="color: var(--edex-cyan); font-size: 0.68rem;" x-text="currentView === 'services' ? (filteredServices.length + ' NODES READY') : (incidents.length + ' EVENTS LOGGED')"></span>
          </div>

          <div class="edex-panel-body">
            <!-- 1. Services Operations View -->
            <template x-if="currentView === 'services'">
              <div style="display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0;">
                <!-- Terminal Command & Search Filter Bar -->
                <div class="edex-toolbar">
                  <div class="edex-search-prompt">
                    <span class="edex-prompt-symbol">&gt;_</span>
                    <input
                      type="text"
                      class="edex-search-input"
                      x-model="searchQuery"
                      placeholder="filter node name, host or port..."
                      aria-label="Filter nodes"
                    >
                    <button
                      type="button"
                      x-show="searchQuery"
                      style="background: transparent; border: none; color: var(--edex-text-muted); cursor: pointer; padding: 2px;"
                      @click="searchQuery = ''"
                    >
                      <svg class="icon"><use href="#icon-close"></use></svg>
                    </button>
                  </div>

                  <!-- Status segment filters -->
                  <div class="edex-filter-group">
                    <button
                      type="button"
                      class="edex-filter-btn"
                      :class="{ 'active': selectedStatus === 'all' }"
                      @click="selectedStatus = 'all'"
                    >
                      ALL
                    </button>
                    <button
                      type="button"
                      class="edex-filter-btn"
                      :class="{ 'active': selectedStatus === 'online' }"
                      @click="selectedStatus = 'online'"
                    >
                      ONLINE
                    </button>
                    <button
                      type="button"
                      class="edex-filter-btn"
                      :class="{ 'active': selectedStatus === 'offline' }"
                      @click="selectedStatus = 'offline'"
                    >
                      OFFLINE
                    </button>
                  </div>
                </div>

                <!-- Empty State -->
                <div x-show="!loadingServices && filteredServices.length === 0" class="empty-state" style="margin: auto;">
                  <div class="empty-icon"><svg class="icon icon-lg"><use href="#icon-terminal"></use></svg></div>
                  <h3 style="font-size: 0.95rem; font-family: var(--font-mono); color: var(--edex-cyan);">NO_NODES_FOUND</h3>
                  <p style="font-size: 0.78rem; color: var(--edex-text-muted); margin: 6px 0 12px;">
                    No services match current search criteria.
                  </p>
                  <button type="button" class="edex-key-btn primary" @click="resetFilters">
                    RESET FILTERS
                  </button>
                </div>

                <!-- Blade Service Cards Grid -->
                <div x-show="filteredServices.length > 0" class="edex-cards-grid">
                  <template x-for="service in filteredServices" :key="service.id">
                    <article
                      class="edex-blade-card"
                      :class="'status-' + window.Format.statusKey(service.serviceStatus)"
                    >
                      <!-- Blade Head -->
                      <div class="edex-blade-head">
                        <div class="edex-blade-title-wrap">
                          <svg class="edex-blade-icon" aria-hidden="true">
                            <use :href="'#icon-' + window.Format.iconSymbol(service.icon)"></use>
                          </svg>
                          <span
                            class="edex-blade-title"
                            x-text="service.name"
                            @click="openServicePanel(service)"
                            :title="service.name"
                          ></span>
                        </div>

                        <!-- Category Pill -->
                        <span
                          style="font-family: var(--font-mono); font-size: 0.62rem; padding: 1px 6px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.15);"
                          :style="{ color: service.categoryColor || 'var(--edex-cyan)', borderColor: service.categoryColor || 'var(--edex-border)' }"
                          x-text="service.categoryName || 'GENERAL'"
                        ></span>
                      </div>

                      <!-- Blade Meta & Status -->
                      <div class="edex-blade-meta">
                        <span class="edex-blade-host" x-text="service.host + ':' + service.port"></span>

                        <div style="display: flex; align-items: center; gap: 6px;">
                          <!-- Status Pill -->
                          <span
                            class="edex-status-pill"
                            :class="window.Format.statusKey(service.serviceStatus)"
                          >
                            <span x-text="service.serviceStatus === 'Online' ? '[RUN // 200]' : (service.serviceStatus === 'Offline' ? '[ERR // 503]' : '[IDLE]')"></span>
                          </span>

                          <!-- Latency -->
                          <span
                            style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--edex-cyan);"
                            x-text="window.Format.responseTime(service.lastResponceTimeMs)"
                          ></span>
                        </div>
                      </div>

                      <!-- 30-Day Uptime Matrix Bar -->
                      <div class="edex-matrix-wrap">
                        <div class="edex-matrix-label">
                          <span>30D UPTIME</span>
                          <span
                            x-text="uptimeCache[service.id]?.data ? Math.round(uptimeCache[service.id].data.overallUptimePercentage) + '%' : '--%'"
                          ></span>
                        </div>
                        <div class="edex-matrix-bar">
                          <template x-for="(day, idx) in (uptimeCache[service.id]?.data?.days || [])" :key="idx">
                            <div
                              class="edex-matrix-cell"
                              :class="day.uptimePercentage >= 98 ? 'online' : (day.uptimePercentage > 0 ? 'offline' : (day.totalChecks > 0 ? 'offline' : 'empty'))"
                              :title="`${day.date}: ${day.uptimePercentage.toFixed(1)}% (${day.successfulChecks}/${day.totalChecks})`"
                            ></div>
                          </template>
                          <!-- Skeleton filler if uptime not yet loaded -->
                          <template x-if="!uptimeCache[service.id]?.data">
                            <template x-for="n in 30" :key="n">
                              <div class="edex-matrix-cell empty"></div>
                            </template>
                          </template>
                        </div>
                      </div>

                      <!-- Action Buttons -->
                      <div class="edex-blade-actions">
                        <button
                          type="button"
                          class="edex-action-btn"
                          @click="checkSingleService(service)"
                          :disabled="!!checkingServiceIds[service.id]"
                          title="Run probe check"
                        >
                          <span x-show="checkingServiceIds[service.id]" class="spinner" aria-hidden="true" style="width: 10px; height: 10px;"></span>
                          <svg class="icon" aria-hidden="true" x-show="!checkingServiceIds[service.id]"><use href="#icon-bolt"></use></svg>
                          <span>PING</span>
                        </button>

                        <div style="display: flex; gap: 4px;">
                          <button
                            type="button"
                            class="edex-action-btn"
                            @click="openServicePanel(service)"
                            title="Inspect details, runbooks, incidents"
                          >
                            <svg class="icon" aria-hidden="true"><use href="#icon-terminal"></use></svg>
                            <span>INSPECT</span>
                          </button>
                          <button
                            type="button"
                            class="edex-action-btn"
                            @click="openEditServiceModal(service)"
                            title="Edit service"
                          >
                            <svg class="icon" aria-hidden="true"><use href="#icon-pencil"></use></svg>
                          </button>
                          <button
                            type="button"
                            class="edex-action-btn btn-danger"
                            @click="confirmDeleteService(service)"
                            title="Delete service"
                          >
                            <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
                          </button>
                        </div>
                      </div>
                    </article>
                  </template>
                </div>
              </div>
            </template>

            <!-- 2. Incidents Global Stream View -->
            <template x-if="currentView === 'incidents'">
              <div style="display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0;">
                <div class="edex-toolbar">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <button
                      type="button"
                      class="edex-filter-btn"
                      :class="{ 'active': !incidentsOnlyOpen }"
                      @click="incidentsOnlyOpen = false"
                    >
                      ALL INCIDENTS
                    </button>
                    <button
                      type="button"
                      class="edex-filter-btn"
                      :class="{ 'active': incidentsOnlyOpen }"
                      @click="incidentsOnlyOpen = true"
                    >
                      ACTIVE OUTAGES ONLY
                    </button>
                  </div>

                  <button
                    type="button"
                    class="edex-action-btn"
                    @click="loadIncidents(false)"
                    :disabled="loadingIncidents"
                    style="margin-left: auto;"
                  >
                    <span x-show="loadingIncidents" class="spinner" aria-hidden="true" style="width: 10px; height: 10px;"></span>
                    <svg class="icon" aria-hidden="true" x-show="!loadingIncidents"><use href="#icon-refresh"></use></svg>
                    <span>REFRESH</span>
                  </button>
                </div>

                <!-- Empty Incidents State -->
                <div x-show="!loadingIncidents && incidents.length === 0" class="empty-state" style="margin: auto;">
                  <div class="empty-icon" style="color: var(--edex-green);"><svg class="icon icon-lg"><use href="#icon-check"></use></svg></div>
                  <h3 style="font-size: 0.95rem; font-family: var(--font-mono); color: var(--edex-green);">ALL_SYSTEMS_OPERATIONAL</h3>
                  <p style="font-size: 0.78rem; color: var(--edex-text-muted);">
                    No outage incidents recorded in telemetry buffer.
                  </p>
                </div>

                <!-- Incidents Scrollable Stream -->
                <div x-show="incidents.length > 0" class="incidents-container" style="overflow-y: auto;">
                  <template x-for="inc in incidents" :key="inc.id">
                    <div class="incident-item" style="background: rgba(6, 12, 22, 0.85); border: 1px solid var(--edex-border);">
                      <div class="incident-header">
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span
                            class="edex-status-pill"
                            :class="inc.isOpen ? 'offline' : 'online'"
                            x-text="inc.isOpen ? '[ONGOING OUTAGE]' : '[RESOLVED]'"
                          ></span>
                          <span class="incident-service" x-text="inc.serviceName"></span>
                        </div>

                        <div class="incident-meta">
                          <span>DURATION: <strong style="color: var(--edex-cyan);" x-text="window.Format.duration(inc.durationSeconds)"></strong></span>
                          <span>STARTED: <strong style="color: var(--edex-text-bright);" x-text="window.Format.dateTime(inc.startedAt)"></strong></span>
                        </div>
                      </div>

                      <div class="incident-reason" style="background: rgba(2, 6, 12, 0.7); border-left: 3px solid var(--edex-red);">
                        <span style="color: var(--edex-red); font-weight: 700;">FAIL_CAUSE: </span>
                        <span x-text="inc.reason || 'Connection timeout / probe check rejected.'"></span>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- ================= ZONE 3: RIGHT PANEL (PORT MATRIX & LIVE STREAM) ================= -->
        <aside class="edex-panel edex-right-col" aria-label="Port Matrix and Live Logs">
          <!-- Subnet Port Matrix -->
          <div class="edex-panel-header">
            <span>[03 // PORT_MATRIX]</span>
            <span style="font-size: 0.62rem; color: var(--edex-text-muted);" x-text="listeningPorts.length + ' PORTS'"></span>
          </div>

          <div style="padding: 8px; border-bottom: 1px solid var(--edex-border);">
            <div class="edex-port-table">
              <template x-for="p in listeningPorts" :key="p.id">
                <div class="edex-port-row">
                  <span class="edex-port-num" x-text="':' + p.port"></span>
                  <span class="edex-port-proto" x-text="p.type"></span>
                  <span class="edex-port-service" x-text="p.name"></span>
                  <span class="edex-pulse-led" :style="{ background: p.status === 'Online' ? 'var(--edex-green)' : 'var(--edex-red)', boxShadow: p.status === 'Online' ? '0 0 6px var(--edex-green)' : '0 0 6px var(--edex-red)' }"></span>
                </div>
              </template>
              <div x-show="listeningPorts.length === 0" style="font-family: var(--font-mono); font-size: 0.68rem; color: var(--edex-text-muted); text-align: center; padding: 8px;">
                NO ACTIVE PORTS
              </div>
            </div>
          </div>

          <!-- Live Streaming Terminal Feed -->
          <div class="edex-panel-header" style="border-top: 1px solid var(--edex-border); margin-top: 4px;">
            <span>[04 // PROBE_FEED]</span>
            <button
              type="button"
              style="background: transparent; border: none; font-family: var(--font-mono); font-size: 0.62rem; color: var(--edex-cyan); cursor: pointer;"
              @click="clearProbeLogs"
            >
              [FLUSH]
            </button>
          </div>

          <div class="edex-terminal-box">
            <div class="edex-terminal-lines">
              <template x-for="log in probeLogs" :key="log.id">
                <div class="edex-terminal-line" :class="log.type">
                  <span class="edex-log-time" x-text="'[' + log.time + ']'"></span>
                  <span x-text="log.text"></span>
                </div>
              </template>
            </div>
          </div>
        </aside>

        <!-- ================= ZONE 4: BOTTOM PANEL (RUNBOOK & ACTION DECK) ================= -->
        <footer class="edex-bottom-dock" aria-label="Runbook & Action Deck">
          <!-- Left: Runbook Command Chips -->
          <div class="edex-runbook-deck">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="edex-dock-label">// RUNBOOK_DECK · CLICK TO COPY</span>
              <span style="font-family: var(--font-mono); font-size: 0.62rem; color: var(--edex-cyan);">CLIPBOARD READY</span>
            </div>

            <div class="edex-chips-grid">
              <template x-for="cmd in quickCommands" :key="cmd.cmd">
                <button
                  type="button"
                  class="edex-chip"
                  :class="{ 'copied': copiedQuickCmd === cmd.cmd }"
                  @click="copyQuickCommand(cmd.cmd)"
                  :title="cmd.cmd"
                >
                  <span class="edex-chip-label" x-text="'[' + cmd.label + ']'"></span>
                  <span x-text="copiedQuickCmd === cmd.cmd ? 'COPIED // 0x01' : cmd.cmd"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- Right: Tactical Control Keypad -->
          <div class="edex-keypad">
            <span class="edex-dock-label">// TACTICAL_KEYPAD</span>
            <div class="edex-keypad-grid">
              <button type="button" class="edex-key-btn primary" @click="openCreateServiceModal">
                <svg class="icon"><use href="#icon-plus"></use></svg>
                <span>+ NODE</span>
              </button>

              <button type="button" class="edex-key-btn" @click="checkAllServices" :disabled="isCheckingAll">
                <span x-show="isCheckingAll" class="spinner" aria-hidden="true" style="width: 10px; height: 10px;"></span>
                <svg class="icon" aria-hidden="true" x-show="!isCheckingAll"><use href="#icon-bolt"></use></svg>
                <span x-text="isCheckingAll ? 'SWEEPING' : 'SWEEP ALL'"></span>
              </button>

              <button type="button" class="edex-key-btn" @click="openCategoryModal">
                <svg class="icon"><use href="#icon-tag"></use></svg>
                <span>CLUSTERS</span>
              </button>

              <button type="button" class="edex-key-btn" @click="openBackupModal">
                <svg class="icon"><use href="#icon-download"></use></svg>
                <span>BACKUP</span>
              </button>
            </div>
          </div>
        </footer>
      </main>

      <!-- 3. Service Detail Side Panel (Flyout Drawer) -->
      <div
        x-show="isPanelOpen"
        class="panel-backdrop"
        @click="closeServicePanel"
        @keydown.escape.window="closeServicePanel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="side-panel-title"
      >
        <div class="side-panel" @click.stop>
          <div class="panel-header">
            <div style="display: flex; align-items: center; gap: var(--space-3); min-width: 0;">
              <div class="service-icon-box">
                <svg class="icon icon-lg" aria-hidden="true"><use :href="selectedService ? '#icon-' + window.Format.iconSymbol(selectedService.icon) : '#icon-server'"></use></svg>
              </div>
              <div style="min-width: 0;">
                <h2 id="side-panel-title" style="font-size: 1.125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" x-text="selectedService ? selectedService.name : 'Service Details'"></h2>
                <div class="service-endpoint" x-text="selectedService ? window.Format.endpoint(selectedService) : ''"></div>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <div
                class="status-badge"
                :class="selectedService ? window.Format.statusKey(selectedService.serviceStatus) : 'unknown'"
              >
                <span class="status-dot" :class="selectedService ? window.Format.statusKey(selectedService.serviceStatus) : 'unknown'"></span>
                <span x-text="selectedService ? window.Format.statusLabel(selectedService.serviceStatus) : 'Unknown'"></span>
              </div>

              <button type="button" class="btn-icon btn-sm" @click="closeServicePanel" aria-label="Close side panel">
                <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
              </button>
            </div>
          </div>

          <!-- Panel Nav Tabs -->
          <div style="padding: var(--space-3) var(--space-5) 0; border-bottom: 1px solid var(--glass-border);">
            <nav class="nav-tabs" style="width: 100%; justify-content: flex-start;" aria-label="Service Panel Tabs">
              <button
                type="button"
                class="nav-tab-btn"
                :class="{ 'active': panelTab === 'overview' }"
                @click="switchPanelTab('overview')"
              >
                Overview
              </button>
              <button
                type="button"
                class="nav-tab-btn"
                :class="{ 'active': panelTab === 'uptime' }"
                @click="switchPanelTab('uptime')"
              >
                Uptime (30d)
              </button>
              <button
                type="button"
                class="nav-tab-btn"
                :class="{ 'active': panelTab === 'runbooks' }"
                @click="switchPanelTab('runbooks')"
              >
                Runbooks (<span x-text="serviceRunbooks.length"></span>)
              </button>
              <button
                type="button"
                class="nav-tab-btn"
                :class="{ 'active': panelTab === 'incidents' }"
                @click="switchPanelTab('incidents')"
              >
                Incidents (<span x-text="serviceIncidents.length"></span>)
              </button>
            </nav>
          </div>

          <div class="panel-body">
            <!-- Tab 1: Overview -->
            <template x-if="panelTab === 'overview'">
              <div style="display: flex; flex-direction: column; gap: var(--space-4);">
                <div class="runbook-card">
                  <h3 style="font-size: 0.875rem; margin-bottom: var(--space-2);">Endpoint Configuration</h3>
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); font-size: 0.8125rem;">
                    <div>
                      <span style="color: var(--text-muted);">Protocol:</span>
                      <strong style="color: var(--text-bright); display: block;" x-text="selectedService && selectedService.useHttps ? 'HTTPS' : 'HTTP'"></strong>
                    </div>
                    <div>
                      <span style="color: var(--text-muted);">Check Type:</span>
                      <strong style="color: var(--text-bright); display: block;" x-text="selectedService ? (selectedService.checkType === 2 ? 'TCP' : 'HTTP') : ''"></strong>
                    </div>
                    <div>
                      <span style="color: var(--text-muted);">Host & Port:</span>
                      <strong style="color: var(--text-bright); display: block; font-family: var(--font-mono);" x-text="selectedService ? `${selectedService.host}:${selectedService.port}` : ''"></strong>
                    </div>
                    <div>
                      <span style="color: var(--text-muted);">Health Path:</span>
                      <strong style="color: var(--text-bright); display: block; font-family: var(--font-mono);" x-text="selectedService && selectedService.healthPath ? selectedService.healthPath : '—'"></strong>
                    </div>
                    <div>
                      <span style="color: var(--text-muted);">Timeout:</span>
                      <strong style="color: var(--text-bright); display: block;" x-text="selectedService ? `${selectedService.timeoutMs} ms` : ''"></strong>
                    </div>
                    <div>
                      <span style="color: var(--text-muted);">Category:</span>
                      <strong style="color: var(--text-bright); display: block;" x-text="selectedService ? selectedService.categoryName : ''"></strong>
                    </div>
                  </div>
                </div>

                <!-- Description -->
                <div class="runbook-card">
                  <h3 style="font-size: 0.875rem; margin-bottom: var(--space-1);">Description</h3>
                  <p style="font-size: 0.8125rem; color: var(--text-muted);" x-text="selectedService && selectedService.description ? selectedService.description : 'No description provided.'"></p>
                </div>

                <!-- Live Status & Telemetry -->
                <div class="runbook-card">
                  <h3 style="font-size: 0.875rem; margin-bottom: var(--space-2);">Live Telemetry</h3>
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                      <span style="color: var(--text-muted); font-size: 0.75rem;">Last Latency:</span>
                      <div class="response-time" style="font-size: 1.125rem; font-family: var(--font-mono);" x-text="selectedService ? window.Format.responseTime(selectedService.lastResponceTimeMs) : '—'"></div>
                    </div>
                    <div>
                      <span style="color: var(--text-muted); font-size: 0.75rem;">Last Probe:</span>
                      <div style="font-size: 0.8125rem; color: var(--text-bright);" x-text="selectedService ? window.Format.dateTime(selectedService.lastCheckedAt) : 'Never'"></div>
                    </div>
                    <button
                      type="button"
                      class="btn btn-secondary btn-sm"
                      @click="checkSingleService(selectedService)"
                      :disabled="!!(selectedService && checkingServiceIds[selectedService.id])"
                    >
                      <span x-show="selectedService && checkingServiceIds[selectedService.id]" class="spinner" aria-hidden="true"></span>
                      <svg class="icon" aria-hidden="true" x-show="!(selectedService && checkingServiceIds[selectedService.id])"><use href="#icon-bolt"></use></svg>
                      <span x-text="(selectedService && checkingServiceIds[selectedService.id]) ? 'Checking...' : 'Probe Now'"></span>
                    </button>
                  </div>

                  <div x-show="selectedService && lastCheckErrors[selectedService.id]" class="error-snippet" style="margin-top: var(--space-3);" role="alert">
                    <span x-text="selectedService ? lastCheckErrors[selectedService.id] : ''"></span>
                  </div>
                </div>

                <div style="display: flex; gap: var(--space-3); margin-top: auto;">
                  <button type="button" class="btn btn-secondary" style="flex: 1;" @click="openEditServiceModal(selectedService)">
                    <svg class="icon" aria-hidden="true"><use href="#icon-pencil"></use></svg> Edit Configuration
                  </button>
                  <button type="button" class="btn btn-danger" @click="confirmDeleteService(selectedService)">
                    <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg> Delete Service
                  </button>
                </div>
              </div>
            </template>

            <!-- Tab 2: Extended Uptime View -->
            <template x-if="panelTab === 'uptime'">
              <div style="display: flex; flex-direction: column; gap: var(--space-4);">
                <div class="runbook-card">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
                    <h3 style="font-size: 0.9375rem;">30-day Availability Strip</h3>
                    <div class="telemetry-pill">
                      <span>Average:</span>
                      <strong style="color: #38bdf8;" x-text="selectedService ? getAverageUptime(selectedService.id) : ''"></strong>
                    </div>
                  </div>

                  <!-- Large Uptime Strip -->
                  <div class="uptime-strip-large">
                    <template x-for="(day, idx) in (selectedService ? getUptimeDays(selectedService.id) : [])" :key="idx">
                      <div
                        class="uptime-cell"
                        :class="getUptimeCellClass(selectedService.id, day)"
                        :title="getUptimeTooltip(selectedService.id, day)"
                      ></div>
                    </template>
                  </div>

                  <!-- Legend -->
                  <div class="uptime-legend" style="margin-top: var(--space-3);">
                    <div class="uptime-legend-item">
                      <span class="uptime-cell status-perfect" style="width: 10px; height: 10px; border-radius: 2px;"></span>
                      <span>100% Online</span>
                    </div>
                    <div class="uptime-legend-item">
                      <span class="uptime-cell status-degraded" style="width: 10px; height: 10px; border-radius: 2px;"></span>
                      <span>&ge; 90% Degraded</span>
                    </div>
                    <div class="uptime-legend-item">
                      <span class="uptime-cell status-down" style="width: 10px; height: 10px; border-radius: 2px;"></span>
                      <span>&lt; 90% Down</span>
                    </div>
                    <div class="uptime-legend-item">
                      <span class="uptime-cell status-nodata" style="width: 10px; height: 10px; border-radius: 2px;"></span>
                      <span>No checks</span>
                    </div>
                  </div>
                </div>

                <!-- Daily Telemetry Breakdown -->
                <div class="runbook-card">
                  <h3 style="font-size: 0.875rem; margin-bottom: var(--space-3);">Daily History Breakdown</h3>

                  <div x-show="selectedService && isUptimeLoading(selectedService.id)" class="empty-state" style="padding: var(--space-4);">
                    <span class="spinner" style="width: 20px; height: 20px;"></span>
                    <span>Retrieving daily history...</span>
                  </div>

                  <div x-show="selectedService && !isUptimeLoading(selectedService.id)" class="uptime-day-grid">
                    <template x-for="day in (selectedService ? getUptimeDays(selectedService.id) : [])" :key="day.date">
                      <div class="uptime-day-card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                          <span style="font-size: 0.6875rem; color: var(--text-dim);" x-text="day.date"></span>
                          <span class="status-dot" :class="getUptimeCellClass(selectedService.id, day)" style="width: 6px; height: 6px;"></span>
                        </div>
                        <div style="font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 600; color: var(--text-bright);" x-text="day.totalChecks > 0 ? window.Format.percentage(day.uptimePercentage) : '—'"></div>
                        <div style="font-size: 0.6875rem; color: var(--text-muted);" x-text="day.totalChecks > 0 ? `${day.onlineChecks}/${day.totalChecks} checks` : 'No checks'"></div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <!-- Tab 3: Runbooks -->
            <template x-if="panelTab === 'runbooks'">
              <div style="display: flex; flex-direction: column; gap: var(--space-4);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <h3 style="font-size: 0.9375rem;">Operational Runbooks</h3>
                  <button type="button" class="btn btn-primary btn-sm" @click="openCreateRunbookModal">
                    <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg> Add Runbook
                  </button>
                </div>

                <!-- Loading state -->
                <div x-show="loadingRunbooks" class="empty-state" style="padding: var(--space-5);">
                  <span class="spinner" style="width: 24px; height: 24px;"></span>
                  <span>Loading service runbooks...</span>
                </div>

                <!-- Empty state -->
                <div x-show="!loadingRunbooks && serviceRunbooks.length === 0" class="empty-state">
                  <div class="empty-icon"><svg class="icon" aria-hidden="true" style="width: 1.5rem; height: 1.5rem;"><use href="#icon-book"></use></svg></div>
                  <h4 style="font-size: 0.9375rem;">No runbooks yet</h4>
                  <p style="font-size: 0.8125rem; color: var(--text-muted);">
                    Document disaster recovery commands, container restart snippets, or diagnostic steps.
                  </p>
                  <button type="button" class="btn btn-primary btn-sm" @click="openCreateRunbookModal">
                    <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg> Create first runbook
                  </button>
                </div>

                <!-- Runbooks List -->
                <template x-for="rb in serviceRunbooks" :key="rb.id">
                  <div class="runbook-card">
                    <div class="runbook-header">
                      <div style="display: flex; align-items: center; gap: var(--space-2);">
                        <span class="shell-badge" x-text="window.Format.shellTypeName(rb.shellType)"></span>
                        <h4 class="runbook-title" x-text="rb.title"></h4>
                      </div>

                      <div style="display: flex; align-items: center; gap: var(--space-2);">
                        <button
                          type="button"
                          class="btn-icon btn-sm"
                          @click="openEditRunbookModal(rb)"
                          title="Edit runbook"
                          aria-label="Edit runbook"
                        >
                          <svg class="icon" aria-hidden="true"><use href="#icon-pencil"></use></svg>
                        </button>
                        <button
                          type="button"
                          class="btn-icon btn-sm"
                          @click="deleteRunbook(rb)"
                          :disabled="deletingRunbookId === rb.id"
                          title="Delete runbook"
                          aria-label="Delete runbook"
                        >
                          <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
                        </button>
                      </div>
                    </div>

                    <!-- Command Snippet with Copy Feedback -->
                    <div class="command-snippet">
                      <button
                        type="button"
                        class="btn btn-secondary btn-sm copy-btn"
                        @click="copyCommand(rb)"
                        aria-label="Copy command snippet"
                      >
                        <svg class="icon" aria-hidden="true" x-show="copiedRunbookId !== rb.id"><use href="#icon-copy"></use></svg>
                        <svg class="icon" aria-hidden="true" x-show="copiedRunbookId === rb.id"><use href="#icon-check"></use></svg>
                        <span x-text="copiedRunbookId === rb.id ? 'Copied!' : 'Copy'"></span>
                      </button>
                      <code x-text="rb.commandText"></code>
                    </div>

                    <!-- Notes -->
                    <p x-show="rb.notes" style="font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-1);" x-text="rb.notes"></p>
                  </div>
                </template>
              </div>
            </template>

            <!-- Tab 4: Service Incidents -->
            <template x-if="panelTab === 'incidents'">
              <div style="display: flex; flex-direction: column; gap: var(--space-4);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <h3 style="font-size: 0.9375rem;">Service Outage Incidents</h3>
                  <button
                    type="button"
                    class="btn btn-secondary btn-sm"
                    @click="loadServiceIncidents(selectedService.id)"
                    :disabled="loadingServiceIncidents"
                  >
                    <span x-show="loadingServiceIncidents" class="spinner" aria-hidden="true"></span>
                    <svg class="icon" aria-hidden="true" x-show="!loadingServiceIncidents"><use href="#icon-refresh"></use></svg>
                    <span>Refresh</span>
                  </button>
                </div>

                <div x-show="loadingServiceIncidents" class="empty-state" style="padding: var(--space-5);">
                  <span class="spinner" style="width: 24px; height: 24px;"></span>
                  <span>Loading service incidents...</span>
                </div>

                <div x-show="!loadingServiceIncidents && serviceIncidents.length === 0" class="empty-state">
                  <div class="empty-icon" style="color: #34d399;"><svg class="icon" aria-hidden="true" style="width: 1.5rem; height: 1.5rem;"><use href="#icon-check"></use></svg></div>
                  <h4 style="font-size: 0.9375rem;">Clean track record</h4>
                  <p style="font-size: 0.8125rem; color: var(--text-muted);">
                    No outages or incident logs recorded for this endpoint.
                  </p>
                </div>

                <template x-for="inc in serviceIncidents" :key="inc.id">
                  <div class="incident-item">
                    <div class="incident-header">
                      <span class="status-badge" :class="inc.isOpen ? 'offline' : 'online'">
                        <span class="status-dot" :class="inc.isOpen ? 'offline' : 'online'"></span>
                        <span x-text="inc.isOpen ? 'Ongoing Outage' : 'Resolved'"></span>
                      </span>

                      <div class="incident-meta">
                        <span>Duration: <strong style="color: #38bdf8;" x-text="window.Format.duration(inc.durationSeconds)"></strong></span>
                      </div>
                    </div>

                    <div class="incident-reason">
                      <span x-text="inc.reason"></span>
                    </div>

                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted);">
                      <span>Started: <span x-text="window.Format.dateTime(inc.startedAt)"></span></span>
                      <span x-show="!inc.isOpen && inc.resolvedAt">
                        Resolved: <span x-text="window.Format.dateTime(inc.resolvedAt)"></span>
                      </span>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Create / Edit Runbook Modal -->
      <div
        x-show="isRunbookModalOpen"
        class="modal-backdrop"
        @keydown.escape.window="closeRunbookModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="runbook-modal-title"
      >
        <div class="modal-dialog" style="max-width: 480px;" @click.outside="closeRunbookModal">
          <div class="modal-header">
            <h2 id="runbook-modal-title" style="font-size: 1rem;" x-text="isRunbookEditMode ? 'Edit Runbook' : 'Add Runbook'"></h2>
            <button type="button" class="btn-icon btn-sm" @click="closeRunbookModal" aria-label="Close dialog">
              <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </div>

          <form @submit.prevent="submitRunbookForm">
            <div class="modal-body">
              <div x-show="runbookFormErrors.general" class="form-error" style="background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; padding: var(--space-3); border-radius: var(--radius-sm);" role="alert">
                <span x-text="runbookFormErrors.general"></span>
              </div>

              <!-- Title -->
              <div class="form-group">
                <label for="rb-title" class="form-label">Runbook title *</label>
                <input
                  id="rb-title"
                  type="text"
                  class="form-input"
                  x-model="runbookForm.title"
                  placeholder="e.g. Restart Docker Container"
                  maxlength="150"
                  required
                >
                <span x-show="runbookFormErrors.title" class="form-error" x-text="runbookFormErrors.title"></span>
              </div>

              <!-- Shell Type -->
              <div class="form-group">
                <label for="rb-shell" class="form-label">Shell / Environment</label>
                <select id="rb-shell" class="form-select" x-model="runbookForm.shellType">
                  <option value="Bash">Bash</option>
                  <option value="PowerShell">PowerShell</option>
                  <option value="Docker">Docker</option>
                </select>
              </div>

              <!-- Command Text -->
              <div class="form-group">
                <label for="rb-cmd" class="form-label">Command text *</label>
                <textarea
                  id="rb-cmd"
                  class="form-textarea"
                  style="font-family: var(--font-mono); font-size: 0.8125rem;"
                  x-model="runbookForm.commandText"
                  placeholder="docker restart service_name or systemctl restart ..."
                  maxlength="500"
                  required
                ></textarea>
                <span x-show="runbookFormErrors.commandText" class="form-error" x-text="runbookFormErrors.commandText"></span>
              </div>

              <!-- Notes -->
              <div class="form-group">
                <label for="rb-notes" class="form-label">Notes (optional)</label>
                <textarea
                  id="rb-notes"
                  class="form-textarea"
                  x-model="runbookForm.notes"
                  placeholder="Additional operator instructions or safety flags..."
                  maxlength="500"
                ></textarea>
                <span x-show="runbookFormErrors.notes" class="form-error" x-text="runbookFormErrors.notes"></span>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" @click="closeRunbookModal">
                Cancel
              </button>
              <button type="submit" class="btn btn-primary" :disabled="savingRunbook">
                <span x-show="savingRunbook" class="spinner" aria-hidden="true"></span>
                <span x-text="savingRunbook ? 'Saving...' : (isRunbookEditMode ? 'Update Runbook' : 'Add Runbook')"></span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Create / Edit Service Modal -->
      <div
        x-show="isServiceModalOpen"
        class="modal-backdrop"
        @keydown.escape.window="closeServiceModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="service-modal-title"
      >
        <div class="modal-dialog" @click.outside="closeServiceModal">
          <div class="modal-header">
            <h2 id="service-modal-title" style="font-size: 1rem;" x-text="isEditMode ? 'Edit Monitored Service' : 'Add New Monitored Service'"></h2>
            <button type="button" class="btn-icon btn-sm" @click="closeServiceModal" aria-label="Close dialog">
              <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </div>

          <form @submit.prevent="submitServiceForm">
            <div class="modal-body">
              <!-- General Error Message -->
              <div x-show="serviceFormErrors.general" class="form-error" style="background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; padding: var(--space-3); border-radius: var(--radius-sm);" role="alert">
                <span x-text="serviceFormErrors.general"></span>
              </div>

              <!-- Name -->
              <div class="form-group">
                <label for="srv-name" class="form-label">Service name *</label>
                <input
                  id="srv-name"
                  type="text"
                  class="form-input"
                  x-model="serviceForm.name"
                  placeholder="e.g. Nextcloud Server"
                  maxlength="100"
                  required
                >
                <span x-show="serviceFormErrors.name" class="form-error" x-text="serviceFormErrors.name"></span>
              </div>

              <!-- Host & Port Row -->
              <div class="form-row-2">
                <div class="form-group">
                  <label for="srv-host" class="form-label">Host / IP *</label>
                  <input
                    id="srv-host"
                    type="text"
                    class="form-input"
                    x-model="serviceForm.host"
                    placeholder="192.168.1.100 or domain"
                    maxlength="255"
                    required
                  >
                  <span x-show="serviceFormErrors.host" class="form-error" x-text="serviceFormErrors.host"></span>
                </div>

                <div class="form-group">
                  <label for="srv-port" class="form-label">Port * (1-65535)</label>
                  <input
                    id="srv-port"
                    type="number"
                    class="form-input"
                    x-model="serviceForm.port"
                    min="1"
                    max="65535"
                    required
                  >
                  <span x-show="serviceFormErrors.port" class="form-error" x-text="serviceFormErrors.port"></span>
                </div>
              </div>

              <!-- Check Type & Protocol -->
              <div class="form-row-2">
                <div class="form-group">
                  <label for="srv-checktype" class="form-label">Check type</label>
                  <select id="srv-checktype" class="form-select" x-model="serviceForm.checkType">
                    <option value="Http">HTTP</option>
                    <option value="Tcp">TCP</option>
                  </select>
                </div>

                <div class="form-group" style="justify-content: flex-end; padding-bottom: 0.5rem;">
                  <label class="form-checkbox-label">
                    <input type="checkbox" x-model="serviceForm.useHttps">
                    <span>Use HTTPS (SSL/TLS)</span>
                  </label>
                </div>
              </div>

              <!-- Health Path & Timeout -->
              <div class="form-row-2">
                <div class="form-group">
                  <label for="srv-healthpath" class="form-label">Health path (for HTTP)</label>
                  <input
                    id="srv-healthpath"
                    type="text"
                    class="form-input"
                    x-model="serviceForm.healthPath"
                    placeholder="/health or /"
                    maxlength="255"
                  >
                  <span x-show="serviceFormErrors.healthPath" class="form-error" x-text="serviceFormErrors.healthPath"></span>
                </div>

                <div class="form-group">
                  <label for="srv-timeout" class="form-label">Timeout (500 - 30000 ms)</label>
                  <input
                    id="srv-timeout"
                    type="number"
                    class="form-input"
                    x-model="serviceForm.timeoutMs"
                    min="500"
                    max="30000"
                    step="100"
                    required
                  >
                  <span x-show="serviceFormErrors.timeoutMs" class="form-error" x-text="serviceFormErrors.timeoutMs"></span>
                </div>
              </div>

              <!-- Category & Icon -->
              <div class="form-row-2">
                <div class="form-group">
                  <label for="srv-category" class="form-label">Category *</label>
                  <select id="srv-category" class="form-select" x-model="serviceForm.categoryId" required>
                    <option value="">Select category...</option>
                    <template x-for="cat in categories" :key="cat.id">
                      <option :value="cat.id" x-text="cat.name"></option>
                    </template>
                  </select>
                  <span x-show="serviceFormErrors.categoryId" class="form-error" x-text="serviceFormErrors.categoryId"></span>
                </div>

                <div class="form-group">
                  <label for="srv-icon" class="form-label">Icon / Symbol (max 50 chars)</label>
                  <input
                    id="srv-icon"
                    type="text"
                    class="form-input"
                    x-model="serviceForm.icon"
                    placeholder="e.g. server, database, docker, web"
                    maxlength="50"
                  >
                  <span x-show="serviceFormErrors.icon" class="form-error" x-text="serviceFormErrors.icon"></span>
                </div>
              </div>

              <!-- Description -->
              <div class="form-group">
                <label for="srv-desc" class="form-label">Description (optional)</label>
                <textarea
                  id="srv-desc"
                  class="form-textarea"
                  x-model="serviceForm.description"
                  placeholder="Notes about service purpose, subnet, container ID..."
                  maxlength="500"
                ></textarea>
                <span x-show="serviceFormErrors.description" class="form-error" x-text="serviceFormErrors.description"></span>
              </div>

              <!-- Monitoring enabled checkbox -->
              <label class="form-checkbox-label">
                <input type="checkbox" x-model="serviceForm.isMonitoringEnabled">
                <span>Enable periodic background health monitoring</span>
              </label>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" @click="closeServiceModal">
                Cancel
              </button>
              <button type="submit" class="btn btn-primary" :disabled="savingService">
                <span x-show="savingService" class="spinner" aria-hidden="true"></span>
                <span x-text="savingService ? 'Saving...' : (isEditMode ? 'Update Service' : 'Save Service')"></span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Delete Service Confirmation Modal -->
      <div
        x-show="isDeleteModalOpen"
        class="modal-backdrop"
        @keydown.escape.window="closeDeleteModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-modal-title"
      >
        <div class="modal-dialog" style="max-width: 440px;" @click.outside="closeDeleteModal">
          <div class="modal-header">
            <h2 id="delete-modal-title" style="font-size: 1rem; color: #fb7185;">Confirm Deletion</h2>
            <button type="button" class="btn-icon btn-sm" @click="closeDeleteModal" aria-label="Close dialog">
              <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </div>

          <div class="modal-body">
            <p style="font-size: 0.875rem;">
              Are you sure you want to delete <strong style="color: var(--text-bright);" x-text="serviceToDelete ? serviceToDelete.name : ''"></strong>?
            </p>
            <p style="font-size: 0.8125rem; color: var(--text-muted);">
              All recorded health logs, incidents, and associated runbooks will be permanently removed.
            </p>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" @click="closeDeleteModal">
              Cancel
            </button>
            <button type="button" class="btn btn-danger" @click="executeDeleteService" :disabled="deletingService">
              <span x-show="deletingService" class="spinner" aria-hidden="true"></span>
              <span x-text="deletingService ? 'Deleting...' : 'Delete Service'"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Manage Categories Modal -->
      <div
        x-show="isCategoryModalOpen"
        class="modal-backdrop"
        @keydown.escape.window="closeCategoryModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="category-modal-title"
      >
        <div class="modal-dialog" style="max-width: 600px;" @click.outside="closeCategoryModal">
          <div class="modal-header">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <svg class="icon" aria-hidden="true" style="color: var(--brand-accent);"><use href="#icon-tag"></use></svg>
              <h2 id="category-modal-title" style="font-size: 1.125rem;">Manage Categories</h2>
            </div>
            <button type="button" class="btn-icon btn-sm" @click="closeCategoryModal" aria-label="Close dialog">
              <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </div>

          <div class="modal-body">
            <!-- Add / Edit Category Form -->
            <form @submit.prevent="saveCategory" class="category-edit-box">
              <h3 style="font-size: 0.875rem; margin-bottom: var(--space-2); color: var(--text-bright);" x-text="isCategoryEditMode ? 'Edit Category' : 'Create New Category'"></h3>
              
              <div class="form-row-2">
                <div class="form-group" style="margin-bottom: 0;">
                  <label for="cat-name" class="form-label">Category Name *</label>
                  <input
                    id="cat-name"
                    type="text"
                    class="form-input"
                    x-model="categoryForm.name"
                    placeholder="e.g. Databases, Media, Gateways"
                    maxlength="50"
                    required
                  >
                  <span x-show="categoryFormErrors.name" class="form-error" x-text="categoryFormErrors.name"></span>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                  <label for="cat-color" class="form-label">Color Hex (#RRGGBB) *</label>
                  <div style="display: flex; gap: var(--space-2); align-items: center;">
                    <input
                      id="cat-color"
                      type="text"
                      class="form-input"
                      x-model="categoryForm.color"
                      placeholder="#38bdf8"
                      maxlength="7"
                      pattern="^#([0-9a-fA-F]{6})$"
                      required
                    >
                    <input
                      type="color"
                      aria-label="Pick color"
                      x-model="categoryForm.color"
                      class="color-picker-input"
                    >
                  </div>
                  <span x-show="categoryFormErrors.color" class="form-error" x-text="categoryFormErrors.color"></span>
                </div>
              </div>

              <!-- Color Presets -->
              <div style="margin-top: var(--space-2);">
                <span style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: var(--space-1);">Preset Palette:</span>
                <div class="color-presets-row">
                  <template x-for="preset in categoryColorPresets" :key="preset">
                    <button
                      type="button"
                      class="color-preset-dot"
                      :style="'background-color: ' + preset"
                      :class="{ 'active': categoryForm.color.toLowerCase() === preset.toLowerCase() }"
                      @click="selectCategoryColor(preset)"
                      :aria-label="'Select color ' + preset"
                    ></button>
                  </template>
                </div>
              </div>

              <div style="display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-3);">
                <button
                  type="button"
                  class="btn btn-secondary btn-sm"
                  x-show="isCategoryEditMode"
                  @click="cancelCategoryEdit"
                >
                  Cancel Edit
                </button>
                <button type="submit" class="btn btn-primary btn-sm" :disabled="savingCategory">
                  <span x-show="savingCategory" class="spinner" aria-hidden="true"></span>
                  <span x-text="savingCategory ? 'Saving...' : (isCategoryEditMode ? 'Update Category' : 'Add Category')"></span>
                </button>
              </div>
            </form>

            <!-- Existing Categories List -->
            <div style="margin-top: var(--space-4);">
              <h3 style="font-size: 0.875rem; margin-bottom: var(--space-2); color: var(--text-muted);">Existing Categories</h3>
              
              <div class="categories-list">
                <template x-if="categories.length === 0">
                  <p style="font-size: 0.8125rem; color: var(--text-muted); text-align: center; padding: var(--space-3);">No categories found.</p>
                </template>

                <template x-for="cat in categories" :key="cat.id">
                  <div class="category-list-item">
                    <div style="display: flex; align-items: center; gap: var(--space-2); min-width: 0;">
                      <span class="category-color-badge" :style="'background-color: ' + cat.color"></span>
                      <strong class="category-name-text" x-text="cat.name"></strong>
                      <span class="category-color-hex" x-text="cat.color"></span>
                    </div>

                    <div style="display: flex; align-items: center; gap: var(--space-1);">
                      <button
                        type="button"
                        class="btn-icon btn-sm"
                        @click="editCategory(cat)"
                        aria-label="Edit category"
                        title="Edit"
                      >
                        <svg class="icon" aria-hidden="true"><use href="#icon-pencil"></use></svg>
                      </button>
                      <button
                        type="button"
                        class="btn-icon btn-sm btn-icon-danger"
                        @click="deleteCategory(cat)"
                        :disabled="deletingCategoryId === cat.id"
                        aria-label="Delete category"
                        title="Delete"
                      >
                        <span x-show="deletingCategoryId === cat.id" class="spinner" aria-hidden="true"></span>
                        <svg class="icon" aria-hidden="true" x-show="deletingCategoryId !== cat.id"><use href="#icon-trash"></use></svg>
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" @click="closeCategoryModal">
              Close
            </button>
          </div>
        </div>
      </div>

      <!-- Backup & Restore Modal -->
      <div
        x-show="isBackupModalOpen"
        class="modal-backdrop"
        @keydown.escape.window="closeBackupModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="backup-modal-title"
      >
        <div class="modal-dialog" style="max-width: 540px;" @click.outside="closeBackupModal">
          <div class="modal-header">
            <div style="display: flex; align-items: center; gap: var(--space-2);">
              <svg class="icon" aria-hidden="true" style="color: var(--brand-accent);"><use href="#icon-download"></use></svg>
              <h2 id="backup-modal-title" style="font-size: 1.125rem;">JSON Backup & Restore</h2>
            </div>
            <button type="button" class="btn-icon btn-sm" @click="closeBackupModal" aria-label="Close dialog">
              <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </div>

          <div class="modal-body">
            <!-- Export Section -->
            <div class="backup-section-card">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3);">
                <div>
                  <h3 style="font-size: 0.9375rem; margin-bottom: var(--space-1); color: var(--text-bright);">Export Configuration</h3>
                  <p style="font-size: 0.8125rem; color: var(--text-muted); margin: 0;">
                    Download all categories, monitored services, and runbooks as a portable JSON snapshot.
                  </p>
                </div>
                <button
                  type="button"
                  class="btn btn-primary btn-sm"
                  style="white-space: nowrap; flex-shrink: 0;"
                  @click="downloadBackup"
                  :disabled="exportingBackup"
                >
                  <span x-show="exportingBackup" class="spinner" aria-hidden="true"></span>
                  <svg class="icon" aria-hidden="true" x-show="!exportingBackup"><use href="#icon-download"></use></svg>
                  <span x-text="exportingBackup ? 'Exporting...' : 'Export JSON'"></span>
                </button>
              </div>
            </div>

            <!-- Import Section -->
