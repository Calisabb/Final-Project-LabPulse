            <div class="backup-section-card" style="margin-top: var(--space-3);">
              <h3 style="font-size: 0.9375rem; margin-bottom: var(--space-1); color: var(--text-bright);">Import & Merge Configuration</h3>
              <p style="font-size: 0.8125rem; color: var(--text-muted); margin-bottom: var(--space-3);">
                Upload a JSON backup file. Existing services and categories are safely merged without overwriting your IDs.
              </p>

              <div class="file-picker-box">
                <input
                  id="backup-file-input"
                  type="file"
                  accept=".json,application/json"
                  style="display: none;"
                  @change="handleBackupFileSelect"
                >
                <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);">
                  <button
                    type="button"
                    class="btn btn-secondary btn-sm"
                    onclick="document.getElementById('backup-file-input').click()"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#icon-upload"></use></svg> Choose File...
                  </button>
                  <span
                    style="font-size: 0.8125rem; color: var(--text-muted); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px;"
                    x-text="importFileName ? importFileName : 'No file chosen'"
                  ></span>
                </div>
              </div>

              <!-- Error message -->
              <div x-show="backupError" x-transition class="form-error" style="margin-top: var(--space-2);" x-text="backupError"></div>

              <!-- Import Action Button -->
              <div style="margin-top: var(--space-3); display: flex; justify-content: flex-end;">
                <button
                  type="button"
                  class="btn btn-primary btn-sm"
                  @click="executeImportBackup"
                  :disabled="!importFile || importingBackup"
                >
                  <span x-show="importingBackup" class="spinner" aria-hidden="true"></span>
                  <svg class="icon" aria-hidden="true" x-show="!importingBackup"><use href="#icon-upload"></use></svg>
                  <span x-text="importingBackup ? 'Merging data...' : 'Import & Restore'"></span>
                </button>
              </div>

              <!-- Import Result Statistics -->
              <template x-if="importResult">
                <div class="import-result-stats" x-transition>
                  <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2);">
                    <svg class="icon" aria-hidden="true" style="color: var(--status-online);"><use href="#icon-check"></use></svg>
                    <strong style="font-size: 0.875rem; color: var(--text-bright);">Import Completed</strong>
                  </div>
                  <div class="result-grid">
                    <div class="result-stat-item">
                      <span class="stat-num" x-text="importResult.categoriesAdded"></span>
                      <span class="stat-label">Categories Added</span>
                    </div>
                    <div class="result-stat-item">
                      <span class="stat-num" x-text="importResult.categoriesSkipped"></span>
                      <span class="stat-label">Categories Skipped</span>
                    </div>
                    <div class="result-stat-item">
                      <span class="stat-num" x-text="importResult.servicesAdded"></span>
                      <span class="stat-label">Services Added</span>
                    </div>
                    <div class="result-stat-item">
                      <span class="stat-num" x-text="importResult.servicesSkipped"></span>
                      <span class="stat-label">Services Skipped</span>
                    </div>
                    <div class="result-stat-item" style="grid-column: span 2;">
                      <span class="stat-num" x-text="importResult.runbooksAdded"></span>
                      <span class="stat-label">Runbooks Added</span>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" @click="closeBackupModal">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

</body>
</html>
